<header class="site-header" data-header>
  <div class="site-header__inner container">
    <a class="logo" href="/" aria-label="{{siteName}}, página inicial">
      <span class="logo__mark" aria-hidden="true"></span>
      <span class="logo__name">{{siteName}}</span>
    </a>
    <nav class="nav" aria-label="Principal">
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="menu" data-menu-toggle>
        <span class="nav__toggle-label">Menu</span>

      </button>

          <li><a class="nav__link" href="/blog"{{current_blog}}>Blog</a></li>
          <li><a class="nav__link" href="/projetos"{{current_projetos}}>Projetos</a></li>

          <li><a class="nav__link" href="/labs"{{current_labs}}>Labs</a></li>

        </ul>
      </div>
    </nav>
