<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Aluno - Ensino Einstein</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f1f5f9;
        }
        .container {
            perspective: 1200px;
            width: 100%;
            max-width: 420px;
        }
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: rotateY(-8deg) rotateX(4deg) translateZ(20px);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
            border-radius: 24px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            transform: translateZ(30px);
        }
        .institution {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .course {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            line-height: 1.3;
        }
        .photo-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            transform: translateZ(40px);
        }
        .photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }
        .student-info {
            text-align: center;
            margin-bottom: 24px;
            transform: translateZ(25px);
        }
        .name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .details {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.8;
        }
        .details strong {
            color: #94a3b8;
            font-weight: 500;
        }
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            transform: translateZ(35px);
        }
        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .validation {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-top: 16px;
            transform: translateZ(20px);
        }
        .validation-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ade80;
            margin-bottom: 6px;
        }
        .validation-time {
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            font-variant-numeric: tabular-nums;
        }
        .status {
            display: inline-block;
            background: #22c55e;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        @media (max-width: 480px) {
            .card {
                padding: 20px;
                border-radius: 20px;
            }
            .name { font-size: 20px; }
            .photo { width: 120px; height: 120px; }
            .course { font-size: 16px; }
        }
    </style>
</head>

                <div class="validation-label">Validação em tempo real</div>

    <script>
        // Update time every second
        function updateTime() {
            const now = new Date();
            const formatted = now.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('currentTime').textContent = formatted;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Generate QR Code with student data
        const qrData = JSON.stringify({
            instituicao: "Ensino Einstein",
            curso: "Psiquiatria da Infância e Adolescência",
            aluno: "Ana Valentina Salvador",
            cpf: "141.679.268-65",
            nascimento: "17/11/1971",
            validacao: new Date().toISOString()
        });
        new QRCode(document.getElementById("qrcode"), {
            text: qrData,
            width: 160,
            height: 160,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        // Optional: simple mouse tilt effect for more 3D feel
        const card = document.getElementById('studentCard');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
        });
    </script>
